<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Loja Espricio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <main class="container mt-5">

        <h1 id="Cadastro" class="text-center mb-4">
            Tarefas
        </h1>

        <form id="cadastro">
            <h1 class="h3 mb-3 fw-normal">Lista de tarefas</h1>

            <div class="form-floating">
                <input type="text" class="form-control" id="nomeTarefa">
                <label for="nomeTarefa">Escreva aqui o nome da sua tarefa</label>
            </div>

        </form>
        <button class="btn btn-primary w-100 py-2" type="submit" value="enviar" id="btnCriar">
            Criar
        </button>

        <ul id="lista"></ul>

        <p id="mensagem" class="text-success fw-bold"></p>

    </main>

    <script src="script.js"></script>

</body>

</html>
